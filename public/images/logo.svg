<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 78" width="190" height="78" fill="none">
  <!-- Top Line: POWER -->
  <!-- Letter P -->
  <text x="14" y="34" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="33" fill="#131B38" letter-spacing="-0.5">P</text>
  
  <!-- Power Icon as O -->
  <g transform="translate(60, 21)">
    <!-- Ring with top opening -->
    <path d="M 0 -13 A 13.5 13.5 0 1 0 7.5 -11.2 M -7.5 -11.2 A 13.5 13.5 0 0 0 0 -13" fill="none" stroke="#F27A1A" stroke-width="4.2" stroke-linecap="round" />
    <!-- Vertical Power Bar -->
    <line x1="0" y1="-15" x2="0" y2="-2" stroke="#F27A1A" stroke-width="4.2" stroke-linecap="round" />
  </g>

  <!-- Letters WER -->
  <text x="80" y="34" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="33" fill="#131B38" letter-spacing="-0.5">WER</text>

  <!-- Bottom Line: TECH + Cable/Plug + ENGINEERS -->
  <!-- Letter TECH -->
  <text x="14" y="68" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="30" fill="#131B38" letter-spacing="-0.5">TECH</text>

  <!-- Orange Power Cord & 2-Pin Plug -->
  <g transform="translate(103, 50)">
    <!-- Cord line -->
    <line x1="0" y1="0" x2="55" y2="0" stroke="#F27A1A" stroke-width="3" stroke-linecap="round" />
    <!-- Plug Body -->
    <path d="M 55 -5.5 C 57 -5.5 58 -4 58 -2.5 L 61 -2.5 L 61 2.5 L 58 2.5 C 58 4 57 5.5 55 5.5 Z" fill="#F27A1A" />
    <!-- Prongs -->
    <line x1="61" y1="-2" x2="65" y2="-2" stroke="#F27A1A" stroke-width="1.8" stroke-linecap="square" />
    <line x1="61" y1="2" x2="65" y2="2" stroke="#F27A1A" stroke-width="1.8" stroke-linecap="square" />
  </g>

  <!-- Word: ENGINEERS -->
  <text x="103" y="67" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="10.5" fill="#2E6B4E" letter-spacing="1">ENGINEERS</text>
</svg>
